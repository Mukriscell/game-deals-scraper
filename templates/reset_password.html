{% extends "base.html" %}
{% block title %}Nueva contraseña — GAMEDEALS{% endblock %}

{% block main %}
<div class="auth-container">
  <div class="auth-card">

    <div class="auth-logo">🎮 GAME<span class="accent">DEALS</span></div>
    <h1 class="auth-title">Nueva contraseña</h1>
    <p class="auth-hint">Elige una contraseña segura para tu cuenta <strong>{{ email }}</strong>.</p>

    <div class="auth-field">
      <label for="rp-pw">Nueva contraseña</label>
      <div class="auth-input-wrap">
        <input type="password" id="rp-pw" autocomplete="new-password"
               placeholder="••••••••" maxlength="128">
        <button type="button" class="auth-eye" aria-label="Mostrar contraseña"
                onclick="togglePw('rp-pw',this)">👁</button>
      </div>
    </div>

    <div class="auth-field">
      <label for="rp-pw2">Confirmar contraseña</label>
      <div class="auth-input-wrap">
        <input type="password" id="rp-pw2" autocomplete="new-password"
               placeholder="••••••••" maxlength="128">
        <button type="button" class="auth-eye" aria-label="Mostrar contraseña"
                onclick="togglePw('rp-pw2',this)">👁</button>
      </div>
    </div>

    <p class="auth-msg" id="rp-msg"></p>
    <button class="auth-submit" id="rp-btn" type="button">Guardar contraseña</button>

    <p class="auth-footer"><a href="/login">← Volver a iniciar sesión</a></p>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

(function () {
  const csrf = () => document.querySelector('meta[name="csrf-token"]').content;

  function showMsg(text, type) {
    const el = document.getElementById('rp-msg');
    el.textContent = text;
    el.className = 'auth-msg auth-msg--' + type;
  }

  document.getElementById('rp-btn').addEventListener('click', async function () {
    const pw  = document.getElementById('rp-pw').value;
    const pw2 = document.getElementById('rp-pw2').value;

    if (!pw)        { showMsg('Ingresa una contraseña', 'err'); return; }
    if (pw.length < 8) { showMsg('Mínimo 8 caracteres', 'err'); return; }
    if (pw !== pw2) { showMsg('Las contraseñas no coinciden', 'err'); return; }

    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    showMsg('', '');

    try {
      const res  = await fetch('/api/password-reset/confirm', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body:    JSON.stringify({ password: pw }),
      });
      const data = await res.json();
      if (data.ok) {
        showMsg('¡Contraseña actualizada! Redirigiendo...', 'ok');
        setTimeout(() => { window.location.href = data.redirect; }, 1200);
      } else {
        showMsg(data.error || 'Error al guardar', 'err');
        btn.disabled = false;
        btn.textContent = 'Guardar contraseña';
      }
    } catch {
      showMsg('Error de red', 'err');
      btn.disabled = false;
      btn.textContent = 'Guardar contraseña';
    }
  });

  document.getElementById('rp-pw2').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('rp-btn').click();
  });
})();
</script>
{% endblock %}
