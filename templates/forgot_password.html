{% extends "base.html" %}
{% block title %}Recuperar contraseña — GAMEDEALS{% endblock %}

{% block main %}
<div class="auth-container">
  <div class="auth-card">

    <div class="auth-logo">🎮 GAME<span class="accent">DEALS</span></div>
    <h1 class="auth-title">Recuperar contraseña</h1>

    <!-- Paso 1: correo -->
    <div id="fp-step1">
      <p class="auth-hint">Ingresa tu correo y te enviaremos un código de verificación.</p>
      <div class="auth-field">
        <label for="fp-email">Correo electrónico</label>
        <input type="email" id="fp-email" autocomplete="email"
               placeholder="tu@correo.com" maxlength="200">
      </div>
      <p class="auth-msg" id="fp-msg1"></p>
      <button class="auth-submit" id="fp-send-btn" type="button">Enviar código</button>
    </div>

    <!-- Paso 2: código -->
    <div id="fp-step2" style="display:none">
      <p class="auth-hint auth-hint--accent" id="fp-sent-hint"></p>
      <div class="auth-field">
        <label for="fp-code">Código de verificación</label>
        <input type="text" id="fp-code" placeholder="123456"
               maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
               autocomplete="one-time-code">
      </div>
      <p class="auth-msg" id="fp-msg2"></p>
      <div style="display:flex;gap:.7rem;flex-wrap:wrap">
        <button class="auth-submit" id="fp-verify-btn" type="button">Verificar código</button>
        <button class="auth-btn-sec" id="fp-back-btn" type="button">← Volver</button>
      </div>
    </div>

    <p class="auth-footer"><a href="/login">← Volver a iniciar sesión</a></p>
  </div>
</div>

<script>
(function () {
  const csrf = () => document.querySelector('meta[name="csrf-token"]').content;

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className   = 'auth-msg auth-msg--' + type;
  }

  const step1    = document.getElementById('fp-step1');
  const step2    = document.getElementById('fp-step2');
  const emailEl  = document.getElementById('fp-email');
  const codeEl   = document.getElementById('fp-code');
  const sendBtn  = document.getElementById('fp-send-btn');
  const verifyBtn= document.getElementById('fp-verify-btn');
  const backBtn  = document.getElementById('fp-back-btn');
  const msg1     = document.getElementById('fp-msg1');
  const msg2     = document.getElementById('fp-msg2');

  sendBtn.addEventListener('click', async function () {
    const email = emailEl.value.trim();
    if (!email) { showMsg(msg1, 'Ingresa tu correo', 'err'); return; }
    sendBtn.disabled = true;
    sendBtn.textContent = 'Enviando...';
    showMsg(msg1, '', '');
    try {
      const res  = await fetch('/api/password-reset/request', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body:    JSON.stringify({ email }),
      });
      const data = await res.json();
      if (data.ok) {
        step1.style.display = 'none';
        step2.style.display = '';
        document.getElementById('fp-sent-hint').textContent =
          'Código enviado a ' + email + '. Revisa tu bandeja de entrada.';
        codeEl.focus();
      } else {
        showMsg(msg1, data.error || 'Error al enviar', 'err');
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar código';
      }
    } catch {
      showMsg(msg1, 'Error de red', 'err');
      sendBtn.disabled = false;
      sendBtn.textContent = 'Enviar código';
    }
  });

  verifyBtn.addEventListener('click', async function () {
    const email = emailEl.value.trim();
    const code  = codeEl.value.trim();
    if (!code) { showMsg(msg2, 'Ingresa el código', 'err'); return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Verificando...';
    showMsg(msg2, '', '');
    try {
      const res  = await fetch('/api/password-reset/verify', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body:    JSON.stringify({ email, code }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = data.redirect;
      } else {
        showMsg(msg2, data.error || 'Código incorrecto', 'err');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verificar código';
      }
    } catch {
      showMsg(msg2, 'Error de red', 'err');
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verificar código';
    }
  });

  backBtn.addEventListener('click', () => {
    step2.style.display = 'none';
    step1.style.display = '';
    sendBtn.disabled = false;
    sendBtn.textContent = 'Enviar código';
    showMsg(msg1, '', '');
  });

  emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.click(); });
  codeEl.addEventListener('keydown',  e => { if (e.key === 'Enter') verifyBtn.click(); });
})();
</script>
{% endblock %}
