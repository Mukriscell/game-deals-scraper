<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificación 2FA – GAMEDEALS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login-card">

      <div class="admin-login-logo">🎮 GAME<span class="accent">DEALS</span></div>
      <div class="admin-login-subtitle">Verificación en dos pasos</div>

      {% if error %}
      <div class="auth-error" style="margin-bottom:1rem">{{ error }}</div>
      {% endif %}

      <p style="text-align:center;color:#8892a0;font-size:0.84rem;margin-bottom:1.4rem;line-height:1.6">
        Ingresa el código de 6 dígitos de tu aplicación autenticadora (Google Authenticator, Authy, etc.).
      </p>

      <form method="POST" class="auth-form">
        <div class="auth-field">
          <label for="code">Código TOTP</label>
          <input type="text" id="code" name="code"
                 maxlength="6" pattern="[0-9]{6}"
                 placeholder="000 000"
                 autocomplete="one-time-code"
                 autofocus
                 style="text-align:center;font-size:1.6rem;letter-spacing:0.6rem;padding:0.7rem"/>
        </div>
        <button type="submit" class="auth-submit">Verificar código</button>
      </form>

      <p style="text-align:center;margin-top:1.2rem;font-size:0.78rem">
        <a href="/admin/login" style="color:#5a6270;text-decoration:none">← Cancelar y volver al login</a>
      </p>

    </div>
  </div>
</body>
</html>
